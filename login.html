<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Vitalium</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/productos.css">
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./logo.png">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Navbar Container -->
    <header id="navbar-container">
        <!-- El navbar se carga aquí automáticamente -->
    </header>

    <div class="login-container">
        <div class="login-card">
            <!-- Encabezado -->
            <div class="login-header">
                <h1 class="login-titulo">Iniciar Sesión</h1>
                <p class="login-subtitulo">Accede a tu cuenta de Vitalium</p>
            </div>

            <!-- Formulario -->
            <form class="login-form" id="form-login">
                <!-- Campo Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Recordarme y Olvidaste contraseña -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="recordarme">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="link-forgot">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <!-- Registro -->
            <div class="login-register">
                <span class="register-text">¿No tienes una cuenta?</span>
                <a href="crear-cuenta.html" class="link-register">Regístrate</a>
            </div>

            <!-- Separador -->
            <div class="divider">
                <span class="divider-text">O continúa con</span>
            </div>

            <!-- Botones Redes Sociales -->
            <div class="social-buttons">
                <button type="button" class="btn-social btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Google
                </button>

                <button type="button" class="btn-social btn-facebook">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                    Facebook
                </button>
            </div>
            <!-- 🔴 NUEVO: Contenedor para mensajes de error/éxito -->
            <div id="login-message" style="margin-top: 15px; display: none;"></div>
            <!-- Volver al inicio -->
            <div class="login-footer">
                <a href="index.html" class="link-home">← Volver al inicio</a>
            </div>
        </div>
    </div>
    <!-- Footer Container -->
    <div id="footer-container">
        <!-- El footer se carga aquí automáticamente -->
    </div>

    <!-- Script para cargar componentes -->
    <script src="./js/auth.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔴 NUEVO: Script de Google Login (sin modificar tu diseño) -->
    <script>
        // ============================================
        // CONFIGURACIÓN DE GOOGLE LOGIN
        // ============================================
        const GOOGLE_CLIENT_ID = '377149430777-bjvj9pe3p1lcrf1cjnn1if6r2967cmr5.apps.googleusercontent.com'; // ← TU CLIENT_ID

        console.log('🚀 Inicializando Google Login...');

        // Inicializar Google cuando carga la página
        window.onload = function () {
            console.log('📱 Window loaded');

            if (typeof google === 'undefined') {
                console.error('❌ Librería de Google no cargada');
                return;
            }

            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleResponse,
                auto_select: false,
                cancel_on_tap_outside: true
            });

            console.log('✅ Google inicializado correctamente');

            // Vincular el botón de Google existente
            vincularBotonGoogle();
        };

        // Función para vincular el botón de Google
        function vincularBotonGoogle() {
            const googleButton = document.querySelector('.btn-google');

            if (googleButton) {
                console.log('✅ Botón de Google encontrado');

                googleButton.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    console.log('🟢 Click en botón de Google detectado');
                    google.accounts.id.prompt(); // Mostrar selector de cuentas
                });

                console.log('✅ Evento click vinculado al botón de Google');
            } else {
                console.log('❌ Botón de Google no encontrado');
            }
        }

        // Manejar la respuesta de Google
        // Manejar la respuesta de Google
        async function handleGoogleResponse(response) {
            console.log('🔵 Respuesta de Google recibida');
            console.log('📦 Token completo:', response);

            if (response.credential) {
                // Mostrar el token en consola
                console.log('🆔 Token (primeros 100 chars):', response.credential.substring(0, 100));

                // Decodificar el token para ver los datos
                try {
                    const tokenParts = response.credential.split('.');
                    if (tokenParts.length === 3) {
                        const payload = JSON.parse(atob(tokenParts[1]));
                        console.log('👤 DATOS DEL USUARIO:');
                        console.log('   - ID Google:', payload.sub);
                        console.log('   - Email:', payload.email);
                        console.log('   - Nombre:', payload.name);
                        console.log('   - Foto:', payload.picture);
                        console.log('   - Email verificado:', payload.email_verified);
                    }
                } catch (e) {
                    console.log('❌ Error decodificando token:', e);
                }

                // Mostrar mensaje de carga
                mostrarMensaje('Verificando con el servidor...', 'info');

                try {
                    // Enviar token al backend
                    const fetchResponse = await fetch('http://localhost:8080/api/auth/google', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: response.credential })
                    });

                    console.log('📊 Status del servidor:', fetchResponse.status);
                    console.log('📊 Status text:', fetchResponse.statusText);

                    // 🔴 IMPORTANTE: Primero obtener el texto de la respuesta
                    const responseText = await fetchResponse.text();
                    console.log('📦 Respuesta del servidor (texto):', responseText);

                    // Intentar parsear como JSON
                    try {
                        const data = JSON.parse(responseText);
                        console.log('✅ JSON parseado correctamente:', data);

                        if (fetchResponse.ok) {
                            console.log('✅ LOGIN EXITOSO');
                            console.log('👤 Usuario:', data);

                            // Guardar datos
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data));

                            mostrarMensaje('¡Login exitoso! Redirigiendo...', 'success');

                            // Redirigir después de 1.5 segundos
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 1500);
                        } else {
                            console.error('❌ Error del backend:', data.error);
                            mostrarMensaje('Error: ' + (data.error || 'Error en el servidor'), 'error');
                        }

                    } catch (jsonError) {
                        console.error('❌ Error parseando JSON:', jsonError);
                        console.error('🔴 La respuesta NO es JSON válido');
                        console.error('🔴 Contenido:', responseText);

                        // Si la respuesta está vacía
                        if (responseText === '') {
                            mostrarMensaje('El servidor respondió vacío (error 500 interno)', 'error');
                        } else {
                            mostrarMensaje('Error: Respuesta inválida del servidor', 'error');
                        }
                    }

                } catch (error) {
                    console.error('🔴 Error de red:', error);
                    mostrarMensaje('Error de conexión con el servidor', 'error');
                }
            } else {
                console.error('❌ No se recibió credential');
            }
        }


        // También vincular después de que el DOM esté listo
        document.addEventListener('DOMContentLoaded', function () {
            console.log('📄 DOM Content Loaded');
            vincularBotonGoogle();
        });

        console.log('✅ Script de Google Login cargad');
    </script>
</body>

</html>
