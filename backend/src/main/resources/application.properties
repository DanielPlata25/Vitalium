#Configuración de BD WorkBench :3

#Configuración del servidor
server.port=8080
spring.application.name=vitalium

#Configuración de la BD
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST:localhost:3306}/${PROD_DB_NAME:vitalium}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:Zelda200!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${PROD_DB_DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jap.properties.hibernate.format_sql=true

#Loggin
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.modularminds.vittalium=DEBUG