#Configuración de BD WorkBench :3

#Configuración del servidor
server.port=8080
spring.application.name=vitalium

#Configuración de la BD
spring.datasource.url=jdbc:mysql://localhost:3306/vitalium?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
sping.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jap.properties.hibernate.format_sql=true

#Loggin
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.modularminds.vittalium=DEBUG

