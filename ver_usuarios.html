<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerUsuarios</title>
    <link rel="stylesheet" href="./css/ver_usuarios.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="./logo.png">
</head>
<body>
    <!-- Navbar Container -->
    <header id="navbar-container"></header>
    <br>
    <!-- Contenedor principal -->
    <div class="container-fluid px-5" style="max-width: 1400px; margin: 0 auto;">
        <div class="volver">
            <span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="flecha">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                <a href="linkDashboard">Volver al Dashboard</a>
            </span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="title-gestion p-0">Gestión de Usuarios</h2>
            <button type="button" id="btn-exportar-csv" class="btn btn-primary">
                <i class="fa-solid fa-download"></i> Exportar CSV
            </button>
        </div>

        <!-- IDs  -->
        <div class="row mb-4" style="justify-content: flex-end;">
            <div class="col-md-6" style="flex-grow: 1;">
                <div style="position: relative;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 10px; color: var(--gris-texto); z-index: 10;"></i>
                    <input type="text" class="form-control" id="buscador" placeholder="Buscar usuarios..." style="padding-left: 35px;">
                </div>
            </div>
            <div class="col-md-4">
                <div style="position: relative;">
                    <i class="fa-solid fa-filter" style="position: absolute; left: 12px; top: 10px; color: var(--gris-texto); z-index: 10; pointer-events: none;"></i>
                    <select class="form-select" id="filtroEstado" style="padding-left: 35px;">
                        <option value="todos">Todos los estados</option>
                        <option value="Activo">Activos</option>
                        <option value="Inactivo">Inactivos</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 overflow-hidden">
                    <table class="table table-hover mb-0">
                        <thead class="bg-dark-green text-white">
                            <tr>
                                <th>Usuario</th>
                                <th>Contacto</th>
                                <th>Pedidos</th>
                                <th>Total Gastado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4" id="userDetailsContainer">
                <div class="card h-100 shadow-sm border-0 text-center p-5">
                    <div class="my-auto">
                        <i class="fa-solid fa-eye fs-1 text-muted"></i>
                        <p class="text-muted mt-3">Selecciona un usuario para ver sus detalles</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container (FUERA del container-fluid) -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="./js/components.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/cart-logic.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/ver_usuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
