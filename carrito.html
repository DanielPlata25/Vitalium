<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tu carrito | Vittalium </title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/productos.css">
    <link rel="stylesheet" href="css/carrito.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./logo.png">

</head>
<body>
    <!-- Navbar Container -->
    <header id="navbar-container">
        <!-- El navbar se carga aquí automáticamente -->
    </header> 
    <div class="volver">
    <span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="flecha">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
    </svg>
    <a href="./catalogo-producto.html"> Continuar Comprando</a>
    </span>
</div>
    <h2 class="title-carro">Carrito de Compras</h2>

    <main class="main-content-carrito">
    <section class="items-lista" id="items-lista">
        <article class="item-carrito">
            <img src="./img/vitamina.jpg" alt="Producto">
            <div class="item-info">
                <h3>Multivitamínico Premium</h3>
                <div class="controles-cantidad">
                    <button>-</button>
                    <span>2</span>
                    <button>+</button>
                </div>
            </div>
            <div class="item-precio-eliminar">
                <button class="btn-eliminar">🗑️</button>
                <p class="precio-unitario">$29.99</p>
                <p class="precio-total">Total: $59.98</p>
            </div>
        </article>
    </section>

    <aside class="resumen-pago">
        <h3>Resumen del Pedido</h3>
        <div class="cupon-area">
            <input type="text" placeholder="Código de cupón">
            <button class="btn-aplicar">Aplicar</button>
        </div>
        <div class="detalles-pago">
            <p>Subtotal <span>$177.44</span></p>
            <p>Envío <span class="gratis">GRATIS</span></p>
            <p>Impuestos (8%) <span>$14.20</span></p>
            <hr>
            <p class="total-grande">Total <span>$191.64</span></p>
        </div>
        <button class="btn-proceder">Proceder al Pago</button>
        <p class="pago-seguro">🔒 Pago 100% seguro y protegido</p>
    </aside>
</main>

    
    <!-- Footer Container -->
    <div id="footer-container">
        <!-- El footer se carga aquí automáticamente -->
    </div>

    <!-- Script para cargar componentes -->
    <script src="./js/components.js"></script>
    <script src="./js/navbar.js"></script>

</body>
</html>
